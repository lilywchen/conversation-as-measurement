[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-as-measurement"
version = "0.1.0"
description = "Privacy-preserving analysis and figure helpers for conversation observability research."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Lily Chen"},
  {name = "Ted Mau"},
  {name = "Michael Gensheimer"},
  {name = "Brian Anthony Nuyen"},
  {name = "Nancy Jiang"},
  {name = "James Zou"},
]
dependencies = [
  "Jinja2>=3.1",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.urls]
Repository = "https://github.com/lilywchen/conversation-as-measurement"

[project.scripts]
conversation-measurement-reproduce = "conversation_measurement.reproduce:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Matplotlib is currently using agg:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/conversation_measurement/paper_figures/*.py" = ["ALL"]
"src/conversation_measurement/reproduce.py" = ["E402"]
